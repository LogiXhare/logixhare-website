name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/

  deploy-staging:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # NOTE (29 Aug 2026): FTPS (encrypted) deploy is broken against this server's vsftpd -
      # the data-channel TLS handshake fails ("gnutls_record_recv: unexpected TLS packet")
      # from every client tried (Node/basic-ftp, lftp/GnuTLS) and every TLS version (1.2, 1.3,
      # 1.3-excluded), even though the control-channel login always succeeds server-side per
      # vsftpd's own debug_ssl log. Root cause undiagnosed beyond that (suspect nf_conntrack_ftp
      # can't track the passive-mode data port once PASV's response is TLS-encrypted, but this
      # needs server-side investigation, not another client tweak). Falling back to plain FTP:
      # this account is chrooted, nologin, scoped to only this domain's folder, and is deploying
      # non-secret static site content - accepted trade-off, see logixhare-website-build.md.
      - name: Deploy to staging
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --delete --verbose ./dist/ ./staging/;
            bye
          "

      - name: Comment staging link on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔎 Staging preview deployed: https://logixhare.com/staging/'
            })

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # See deploy-staging: plain FTP fallback, FTPS data-channel is broken server-side.
      - name: Deploy to production
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror -R --delete --verbose --exclude-glob staging/ ./dist/ ./;
            bye
          "
