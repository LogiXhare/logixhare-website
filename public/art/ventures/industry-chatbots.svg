><path d="M316.3,153.0 L316.3,175.0 A3.7,2.1 0 0 0 323.7,175.0 L323.7,153.0 Z" fill="url(#cylG)"/><ellipse cx="320.0" cy="153.0" rx="3.7" ry="2.1" fill="url(#gTop)"/><ellipse cx="320.0" cy="153.0" rx="3.7" ry="2.1" fill="none" stroke="#61c0e0" stroke-opacity=".3"/><polygon points="346.0,241.0 375.4,258.0 372.0,260.0 342.5,243.0" fill="url(#fTop)"/><polygon points="342.5,307.0 372.0,324.0 372.0,260.0 342.5,243.0" fill="url(#fLeft)"/><polygon points="375.4,322.0 372.0,324.0 372.0,260.0 375.4,258.0" fill="url(#fRight)"/><polyline points="342.5,243.0 346.0,241.0 375.4,258.0" fill="none" stroke="#61c0e0" stroke-opacity=".22" stroke-width="1"/><polygon points="346.0,305.0 368.5,318.0 368.5,262.0 346.0,249.0" fill="url(#screen)"/><polygon class="pop" style="animation-delay:0.0s" points="347.8,265.7 359.5,272.5 359.5,263.5 347.8,256.8" fill="#61c0e0" opacity=".85"/><polygon class="pop" style="animation-delay:0.9s" points="355.0,283.3 366.7,290.1 366.7,281.1 355.0,274.4" fill="#bef264" opacity=".85"/><polygon class="pop" style="animation-delay:1.8s" points="347.8,292.6 361.7,300.7 361.7,291.7 347.8,283.6" fill="#5870a8" opacity=".85"/>
