<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A network topology: an edge router feeding two switches, which fan out to endpoints and a wireless access point">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- links, drawn first so nodes sit on top -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.5" stroke-opacity=".55">
    <path d="M320 92v44"/>
    <path d="M320 178L184 236"/>
    <path d="M320 178l136 58"/>
    <path d="M184 272v34h-64v28"/>
    <path d="M184 272v62"/>
    <path d="M184 272v34h64v28"/>
    <path d="M456 272v34h-52v28"/>
    <path d="M456 272v34h52v28"/>
  </g>
  <path d="M320 112V88" fill="none" stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- internet cloud: the 34-radius arc reaches y≈14, so the whole shape stays
       inside the viewBox — an earlier version sat 20px higher and was clipped -->
  <path d="M286 88h62a24 24 0 0 0 0-48 34 34 0 0 0-64-12 24 24 0 0 0 2 60Z"
        fill="#0b1c31" stroke="#8fb7cf" stroke-opacity=".5" stroke-width="1.5"/>

  <!-- edge router -->
  <g transform="translate(320 136)">
    <rect x="-66" y="-24" width="132" height="48" rx="9" fill="#0b1c31" stroke="url(#ln)" stroke-width="1.8"/>
    <g stroke="#2dc7c9" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M-34 -6h24m-8-7 8 7-8 7"/><path d="M34 6H10m8 7-8-7 8-7"/>
    </g>
    <circle cx="-50" cy="0" r="4" fill="#2dc7c9" class="blink"/>
  </g>

  <!-- switches -->
  <g transform="translate(184 248)">
    <rect x="-56" y="-22" width="112" height="44" rx="8" fill="#0b1c31" stroke="url(#ln)" stroke-width="1.7"/>
    <g stroke="#8fb7cf" stroke-opacity=".55" stroke-width="1.3">
      <line x1="-30" y1="-8" x2="-30" y2="8"/><line x1="-14" y1="-8" x2="-14" y2="8"/>
      <line x1="2" y1="-8" x2="2" y2="8"/><line x1="18" y1="-8" x2="18" y2="8"/><line x1="34" y1="-8" x2="34" y2="8"/>
    </g>
    <circle cx="-42" cy="0" r="3.5" fill="#2dc7c9" class="blink b2"/>
  </g>
  <g transform="translate(456 248)">
    <rect x="-56" y="-22" width="112" height="44" rx="8" fill="#0b1c31" stroke="url(#ln)" stroke-width="1.7"/>
    <g stroke="#8fb7cf" stroke-opacity=".55" stroke-width="1.3">
      <line x1="-30" y1="-8" x2="-30" y2="8"/><line x1="-14" y1="-8" x2="-14" y2="8"/>
      <line x1="2" y1="-8" x2="2" y2="8"/><line x1="18" y1="-8" x2="18" y2="8"/><line x1="34" y1="-8" x2="34" y2="8"/>
    </g>
    <circle cx="-42" cy="0" r="3.5" fill="#2dc7c9" class="blink b3"/>
  </g>

  <!-- endpoints -->
  <g fill="#0b1c31" stroke="#8fb7cf" stroke-opacity=".55" stroke-width="1.5">
    <rect x="94" y="334" width="52" height="36" rx="5"/>
    <rect x="158" y="334" width="52" height="36" rx="5"/>
    <rect x="222" y="334" width="52" height="36" rx="5"/>
    <rect x="378" y="334" width="52" height="36" rx="5"/>
  </g>
  <g stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.4" stroke-linecap="round">
    <line x1="110" y1="378" x2="130" y2="378"/><line x1="174" y1="378" x2="194" y2="378"/>
    <line x1="238" y1="378" x2="258" y2="378"/><line x1="394" y1="378" x2="414" y2="378"/>
  </g>

  <!-- access point -->
  <g transform="translate(508 352)" fill="none" stroke="#2dc7c9" stroke-width="1.7" stroke-linecap="round">
    <path d="M-20 -12a20 20 0 0 1 40 0" stroke-opacity=".5"/>
    <path d="M-12 -4a12 12 0 0 1 24 0" stroke-opacity=".75"/>
    <circle cx="0" cy="6" r="3.5" fill="#2dc7c9" stroke="none" class="blink"/>
  </g>

  <style>
    .blink { animation: lx 3.4s ease-in-out infinite; }
    .b2 { animation-delay: 1.1s } .b3 { animation-delay: 2.2s }
    @keyframes lx { 0%,100% { opacity:.4 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none } }
  </style>
</svg>
