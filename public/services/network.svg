<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="An isometric router with antennas linking two office buildings, with a wireless access point overhead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2136"/><stop offset=".55" stop-color="#0e2740"/><stop offset="1" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5675"/><stop offset="1" stop-color="#22455f"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f5a"/><stop offset="1" stop-color="#142e46"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112436"/><stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dc7c9" stop-opacity=".2"/><stop offset="1" stop-color="#2dc7c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#04101b" stop-opacity=".7"/><stop offset="1" stop-color="#04101b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rtrL"><polygon points="-62,18 0,54 0,78 -62,42"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <polygon points="320,120 630,300 320,480 10,300" fill="#0a1b2b" opacity=".5"/>
  <g stroke="#2dc7c9" stroke-opacity=".1" stroke-width="1">
    <path d="M165 210L475 390M245 164L555 344"/><path d="M475 210L165 390"/>
  </g>
  <ellipse cx="320" cy="300" rx="240" ry="115" fill="url(#pool)"/>

  <!-- ===== left office building ===== -->
  <g transform="translate(130 252)">
    <ellipse cx="0" cy="26" rx="76" ry="32" fill="url(#shadow)"/>
    <polygon points="0,-132 56,-100 0,-68 -56,-100" fill="url(#fTop)"/>
    <polygon points="-56,-100 0,-68 0,26 -56,-6" fill="url(#fLeft)"/>
    <polygon points="0,-68 56,-100 56,-6 0,26" fill="url(#fRight)"/>
    <!-- windows -->
    <g fill="#2dc7c9">
      <polygon points="-46,-88 -32,-80 -32,-66 -46,-74" fill-opacity=".5"/>
      <polygon points="-26,-77 -12,-69 -12,-55 -26,-63" fill-opacity=".7" class="b"/>
      <polygon points="-46,-58 -32,-50 -32,-36 -46,-44" fill-opacity=".35"/>
      <polygon points="-26,-47 -12,-39 -12,-25 -26,-33" fill-opacity=".55" class="b b2"/>
      <polygon points="-46,-28 -32,-20 -32,-6 -46,-14" fill-opacity=".45"/>
      <polygon points="-26,-17 -12,-9 -12,5 -26,-3" fill-opacity=".3"/>
    </g>
    <g fill="#8fb7cf" fill-opacity=".12">
      <polygon points="12,-71 26,-79 26,-65 12,-57"/>
      <polygon points="32,-82 46,-90 46,-76 32,-68"/>
      <polygon points="12,-41 26,-49 26,-35 12,-27"/>
      <polygon points="32,-52 46,-60 46,-46 32,-38"/>
    </g>
  </g>

  <!-- ===== right office building ===== -->
  <g transform="translate(516 268)">
    <ellipse cx="0" cy="20" rx="66" ry="28" fill="url(#shadow)"/>
    <polygon points="0,-104 48,-76 0,-48 -48,-76" fill="url(#fTop)"/>
    <polygon points="-48,-76 0,-48 0,20 -48,-8" fill="url(#fLeft)"/>
    <polygon points="0,-48 48,-76 48,-8 0,20" fill="url(#fRight)"/>
    <g fill="#2dc7c9">
      <polygon points="-38,-66 -26,-59 -26,-47 -38,-54" fill-opacity=".45"/>
      <polygon points="-20,-56 -8,-49 -8,-37 -20,-44" fill-opacity=".65" class="b b3"/>
      <polygon points="-38,-40 -26,-33 -26,-21 -38,-28" fill-opacity=".3"/>
      <polygon points="-20,-30 -8,-23 -8,-11 -20,-18" fill-opacity=".5"/>
    </g>
    <g fill="#8fb7cf" fill-opacity=".12">
      <polygon points="10,-50 22,-57 22,-45 10,-38"/>
      <polygon points="28,-60 40,-67 40,-55 28,-48"/>
    </g>
  </g>

  <!-- ===== router, centre front ===== -->
  <g transform="translate(320 250)">
    <ellipse cx="0" cy="56" rx="92" ry="38" fill="url(#shadow)"/>
    <!-- antennas -->
    <g stroke="#1d3f5a" stroke-width="5" stroke-linecap="round">
      <path d="M-40 -2v-42"/><path d="M40 -2v-42"/>
    </g>
    <g fill="#2dc7c9">
      <circle cx="-40" cy="-46" r="4" class="b"/>
      <circle cx="40" cy="-46" r="4" class="b b2"/>
    </g>
    <polygon points="0,-12 62,24 0,60 -62,24" fill="url(#fTop)"/>
    <polygon points="-62,24 0,60 0,78 -62,42" fill="url(#fLeft)"/>
    <polygon points="0,60 62,24 62,42 0,78" fill="url(#fRight)"/>
    <!-- port row on the front face -->
    <g clip-path="url(#rtrL)">
      <g fill="#0c1f31">
        <polygon points="-52,26 -38,34 -38,46 -52,38"/>
        <polygon points="-34,36 -20,44 -20,56 -34,48"/>
        <polygon points="-16,46 -2,54 -2,66 -16,58"/>
      </g>
      <g fill="#2dc7c9">
        <polygon points="-50,29 -40,35 -40,40 -50,34" class="b b3"/>
        <polygon points="-32,39 -22,45 -22,50 -32,44" fill-opacity=".6"/>
        <polygon points="-14,49 -4,55 -4,60 -14,54" class="b"/>
      </g>
    </g>
    <g fill="#8fb7cf" fill-opacity=".18">
      <polygon points="16,50 30,42 30,54 16,62"/>
      <polygon points="34,40 48,32 48,44 34,52"/>
    </g>
    <polyline points="0,-12 62,24 62,42" fill="none" stroke="#2dc7c9" stroke-opacity=".28" stroke-width="1.2"/>
  </g>

  <!-- links, router to each building -->
  <g fill="none" stroke="#2dc7c9" stroke-width="2.2" stroke-linecap="round">
    <path d="M262 258Q206 262 172 250" stroke-opacity=".5"/>
    <path d="M382 258Q444 264 480 254" stroke-opacity=".5"/>
  </g>

  <!-- access point overhead -->
  <g transform="translate(320 96)">
    <ellipse cx="0" cy="4" rx="26" ry="12" fill="#0d2134"/>
    <ellipse cx="0" cy="0" rx="26" ry="12" fill="#1d3f5a"/>
    <ellipse cx="0" cy="-3" rx="26" ry="12" fill="url(#fTop)"/>
    <ellipse cx="0" cy="-3" rx="9" ry="4.5" fill="#2dc7c9" fill-opacity=".75" class="b"/>
    <ellipse cx="0" cy="-3" rx="26" ry="12" fill="none" stroke="#2dc7c9" stroke-opacity=".4" stroke-width="1.4"/>
    <g fill="none" stroke="#2dc7c9" stroke-width="1.8" stroke-linecap="round">
      <path d="M-26 22a34 18 0 0 1 52 0" stroke-opacity=".35" class="wave"/>
      <path d="M-15 36a22 12 0 0 1 30 0" stroke-opacity=".25" class="wave w2"/>
    </g>
  </g>

  <style>
    .b { animation: blink 3.4s ease-in-out infinite }
    .b2 { animation-delay: 1.1s } .b3 { animation-delay: 2.2s }
    .wave { animation: w 3s ease-in-out infinite }
    .w2 { animation-delay: .6s }
    @keyframes blink { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes w { 0%,100% { opacity:.2 } 50% { opacity:.8 } }
    @media (prefers-reduced-motion: reduce) { .b, .wave { animation: none } }
  </style>
</svg>
