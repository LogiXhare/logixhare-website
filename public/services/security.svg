<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="An isometric server cabinet behind a standing shield, with a padlock above it and traffic arriving from one side">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2136"/><stop offset=".55" stop-color="#0e2740"/><stop offset="1" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5675"/><stop offset="1" stop-color="#22455f"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f5a"/><stop offset="1" stop-color="#142e46"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112436"/><stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dc7c9" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2dc7c9" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dc7c9" stop-opacity=".2"/><stop offset="1" stop-color="#2dc7c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#04101b" stop-opacity=".7"/><stop offset="1" stop-color="#04101b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cabL"><polygon points="-56,-100 0,-68 0,14 -56,-18"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <polygon points="320,120 630,300 320,480 10,300" fill="#0a1b2b" opacity=".5"/>
  <g stroke="#2dc7c9" stroke-opacity=".1" stroke-width="1">
    <path d="M165 210L475 390M245 164L555 344"/><path d="M475 210L165 390"/>
  </g>
  <ellipse cx="330" cy="290" rx="235" ry="115" fill="url(#pool)"/>

  <!-- ===== protected cabinet, behind ===== -->
  <g transform="translate(396 236)">
    <ellipse cx="0" cy="14" rx="76" ry="32" fill="url(#shadow)"/>
    <polygon points="0,-132 56,-100 0,-68 -56,-100" fill="url(#fTop)"/>
    <polygon points="-56,-100 0,-68 0,14 -56,-18" fill="url(#fLeft)"/>
    <polygon points="0,-68 56,-100 56,-18 0,14" fill="url(#fRight)"/>
    <g clip-path="url(#cabL)">
      <g transform="skewY(-30)">
        <g fill="#0c1f31">
          <rect x="-50" y="-86" width="44" height="13" rx="3"/>
          <rect x="-50" y="-68" width="44" height="13" rx="3"/>
          <rect x="-50" y="-50" width="44" height="13" rx="3"/>
          <rect x="-50" y="-32" width="44" height="13" rx="3"/>
        </g>
        <g fill="#2dc7c9">
          <circle cx="-44" cy="-80" r="3" class="b"/>
          <circle cx="-44" cy="-62" r="3" opacity=".6"/>
          <circle cx="-44" cy="-44" r="3" class="b b2"/>
          <circle cx="-44" cy="-26" r="3" opacity=".75"/>
        </g>
      </g>
    </g>
    <g fill="#8fb7cf" fill-opacity=".12">
      <polygon points="12,-72 26,-80 26,-66 12,-58"/>
      <polygon points="32,-83 46,-91 46,-77 32,-69"/>
      <polygon points="12,-44 26,-52 26,-38 12,-30"/>
    </g>
  </g>

  <!-- ===== shield, standing in front ===== -->
  <g transform="translate(250 268)">
    <ellipse cx="0" cy="18" rx="74" ry="26" fill="url(#shadow)"/>
    <!-- thin standing slab: face plus a side edge for depth -->
    <polygon points="6,-158 74,-128 74,-52 6,4" fill="#173a54"/>
    <path d="M0 -156 68 -126v74c0 30-30 50-68 66-38-16-68-36-68-66v-74l68-30Z"
          transform="translate(-6 2)" fill="#0f2b41"/>
    <path d="M0 -156 68 -126v74c0 30-30 50-68 66-38-16-68-36-68-66v-74l68-30Z"
          fill="url(#shieldFace)" stroke="#2dc7c9" stroke-width="2.4" stroke-opacity=".9"/>
    <!-- scan band sweeping the face -->
    <g clip-path="none" opacity=".55">
      <path d="M-62 -70h124" stroke="#7ee8e9" stroke-width="10" stroke-opacity=".35" class="sweep"/>
    </g>
    <polyline points="-24,-52 -6,-34 32,-86" fill="none" stroke="#7ee8e9" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== padlock above ===== -->
  <g transform="translate(250 92)">
    <path d="M-16 4v-14a16 16 0 0 1 32 0v14" fill="none" stroke="#2dc7c9" stroke-width="5" stroke-linecap="round"/>
    <polygon points="0,-6 30,11 0,28 -30,11" fill="url(#fTop)"/>
    <polygon points="-30,11 0,28 0,48 -30,31" fill="url(#fLeft)"/>
    <polygon points="0,28 30,11 30,31 0,48" fill="url(#fRight)"/>
    <ellipse cx="0" cy="9" rx="7" ry="4" fill="#2dc7c9" fill-opacity=".8" class="b"/>
  </g>

  <!-- inbound traffic: accepted on the left, one dropped -->
  <g stroke="#2dc7c9" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M40 250h84" stroke-opacity=".5"/>
    <path d="M28 290h96" stroke-opacity=".5"/>
  </g>
  <g fill="#2dc7c9">
    <circle cx="92" cy="250" r="5" class="b"/>
    <circle cx="66" cy="290" r="5" class="b b2"/>
  </g>
  <g stroke="#8fb7cf" stroke-opacity=".28" stroke-width="2" stroke-dasharray="4 7" fill="none">
    <path d="M44 330h58"/>
  </g>
  <g transform="translate(120 330)" stroke="#e2607a" stroke-opacity=".85" stroke-width="2.8" stroke-linecap="round">
    <line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/>
  </g>

  <style>
    .b { animation: blink 3.4s ease-in-out infinite }
    .b2 { animation-delay: 1.1s }
    .sweep { animation: sw 4.2s cubic-bezier(.45,0,.55,1) infinite }
    @keyframes blink { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes sw { 0%,100% { transform: translateY(-58px) } 50% { transform: translateY(82px) } }
    @media (prefers-reduced-motion: reduce) { .b, .sweep { animation: none } }
  </style>
</svg>
