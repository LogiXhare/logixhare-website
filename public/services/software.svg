<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Business modules feeding a central database, with a reporting panel drawn from it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- module boxes feeding the core -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".45" stroke-width="1.3">
    <rect x="48" y="56" width="128" height="46" rx="7"/>
    <rect x="48" y="128" width="128" height="46" rx="7"/>
    <rect x="48" y="200" width="128" height="46" rx="7"/>
    <rect x="48" y="272" width="128" height="46" rx="7"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".34">
    <rect x="64" y="72" width="68" height="7" rx="3.5"/><rect x="64" y="85" width="44" height="6" rx="3"/>
    <rect x="64" y="144" width="80" height="7" rx="3.5"/><rect x="64" y="157" width="40" height="6" rx="3"/>
    <rect x="64" y="216" width="56" height="7" rx="3.5"/><rect x="64" y="229" width="52" height="6" rx="3"/>
    <rect x="64" y="288" width="74" height="7" rx="3.5"/><rect x="64" y="301" width="36" height="6" rx="3"/>
  </g>
  <g fill="#2dc7c9" fill-opacity=".7">
    <circle cx="62" cy="79" r="3.5"/><circle cx="62" cy="151" r="3.5"/>
    <circle cx="62" cy="223" r="3.5"/><circle cx="62" cy="295" r="3.5"/>
  </g>

  <!-- feeds -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.4" stroke-opacity=".6">
    <path d="M176 79h44q20 0 20 20v58"/>
    <path d="M176 151h64q0 0 0 0"/>
    <path d="M176 223h64"/>
    <path d="M176 295h44q20 0 20-20v-58"/>
  </g>
  <g fill="#2dc7c9">
    <circle cx="196" cy="79" r="3" class="flow"/>
    <circle cx="210" cy="151" r="3" class="flow f2"/>
    <circle cx="210" cy="223" r="3" class="flow f3"/>
    <circle cx="196" cy="295" r="3" class="flow f4"/>
  </g>

  <!-- central database -->
  <g transform="translate(300 200)" fill="none" stroke="url(#ln)" stroke-width="1.8">
    <ellipse cx="0" cy="-54" rx="58" ry="22"/>
    <path d="M-58 -54v108c0 12 26 22 58 22s58-10 58-22V-54"/>
    <path d="M-58 -18c0 12 26 22 58 22s58-10 58-22"/>
    <path d="M-58 18c0 12 26 22 58 22s58-10 58-22" stroke-opacity=".6"/>
  </g>
  <ellipse cx="300" cy="146" rx="58" ry="22" fill="#2dc7c9" fill-opacity=".12"/>

  <!-- reporting panel -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.6" stroke-opacity=".9">
    <rect x="430" y="118" width="162" height="164" rx="9"/>
    <line x1="430" y1="150" x2="592" y2="150" stroke-opacity=".5"/>
  </g>
  <rect x="446" y="130" width="60" height="8" rx="4" fill="#8fb7cf" fill-opacity=".4"/>
  <g fill="#2dc7c9" fill-opacity=".75">
    <rect x="452" y="226" width="20" height="36" rx="3"/>
    <rect x="484" y="206" width="20" height="56" rx="3"/>
    <rect x="516" y="184" width="20" height="78" rx="3"/>
    <rect x="548" y="164" width="20" height="98" rx="3" class="blink"/>
  </g>
  <path d="M452 200l32-18 32-16 32-22" fill="none" stroke="#8fb7cf" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- core to report -->
  <path d="M358 200h72" fill="none" stroke="url(#ln)" stroke-width="1.4" stroke-opacity=".6"/>

  <style>
    .flow { animation: lx 3.2s ease-in-out infinite; }
    .f2 { animation-delay: .8s } .f3 { animation-delay: 1.6s } .f4 { animation-delay: 2.4s }
    .blink { animation: lx 3.6s ease-in-out infinite; }
    @keyframes lx { 0%,100% { opacity:.4 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none } }
  </style>
</svg>
