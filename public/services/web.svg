<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A browser window with a product grid and checkout, beside a phone showing the same layout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- browser window -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.6">
    <rect x="56" y="62" width="400" height="276" rx="10" stroke-opacity=".9"/>
    <line x1="56" y1="98" x2="456" y2="98" stroke-opacity=".6"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".5">
    <circle cx="76" cy="80" r="4"/><circle cx="92" cy="80" r="4"/><circle cx="108" cy="80" r="4"/>
  </g>
  <rect x="132" y="73" width="200" height="14" rx="7" fill="#8fb7cf" fill-opacity=".18"/>

  <!-- product grid -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.3">
    <rect x="80" y="122" width="108" height="86" rx="6"/>
    <rect x="202" y="122" width="108" height="86" rx="6"/>
    <rect x="324" y="122" width="108" height="86" rx="6"/>
  </g>
  <g fill="#2dc7c9" fill-opacity=".22">
    <rect x="80" y="122" width="108" height="46" rx="6"/>
    <rect x="202" y="122" width="108" height="46" rx="6"/>
    <rect x="324" y="122" width="108" height="46" rx="6"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".35">
    <rect x="92" y="180" width="60" height="7" rx="3.5"/>
    <rect x="214" y="180" width="72" height="7" rx="3.5"/>
    <rect x="336" y="180" width="54" height="7" rx="3.5"/>
    <rect x="92" y="193" width="36" height="6" rx="3"/>
    <rect x="214" y="193" width="36" height="6" rx="3"/>
    <rect x="336" y="193" width="36" height="6" rx="3"/>
  </g>

  <!-- checkout row -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".35" stroke-width="1.3">
    <rect x="80" y="232" width="248" height="76" rx="6"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".3">
    <rect x="96" y="250" width="140" height="8" rx="4"/>
    <rect x="96" y="268" width="96" height="7" rx="3.5"/>
    <rect x="96" y="285" width="118" height="7" rx="3.5"/>
  </g>
  <rect x="348" y="258" width="84" height="30" rx="15" fill="#2dc7c9" fill-opacity=".85"/>
  <path d="M370 273h22m-6-6 6 6-6 6" stroke="#06202b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone, same layout narrower -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.6">
    <rect x="490" y="104" width="94" height="196" rx="14" stroke-opacity=".9"/>
    <line x1="524" y1="118" x2="550" y2="118" stroke-opacity=".6" stroke-linecap="round"/>
  </g>
  <g fill="#2dc7c9" fill-opacity=".22">
    <rect x="504" y="132" width="66" height="40" rx="5"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".32">
    <rect x="504" y="182" width="66" height="7" rx="3.5"/>
    <rect x="504" y="196" width="44" height="6" rx="3"/>
    <rect x="504" y="214" width="66" height="7" rx="3.5"/>
    <rect x="504" y="228" width="50" height="6" rx="3"/>
  </g>
  <rect x="504" y="254" width="66" height="24" rx="12" fill="#2dc7c9" fill-opacity=".55"/>

  <!-- cart badge -->
  <g transform="translate(432 118)">
    <circle r="22" fill="#0b1c31" stroke="#2dc7c9" stroke-width="1.6"/>
    <g stroke="#2dc7c9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-11,-11) scale(.92)">
      <circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>
      <path d="M3 4h2.2l2.4 11.2h10.6l1.8-7.6H6.2"/>
    </g>
    <circle cx="13" cy="-13" r="6" fill="#2dc7c9" class="blink"/>
  </g>

  <style>
    .blink { animation: lx 3.6s ease-in-out infinite; }
    @keyframes lx { 0%,100% { opacity:.45 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none } }
  </style>
</svg>
