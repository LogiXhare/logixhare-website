<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="An isometric desktop monitor showing an online store, with a phone beside it displaying the same layout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2136"/><stop offset=".55" stop-color="#0e2740"/><stop offset="1" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5675"/><stop offset="1" stop-color="#22455f"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f5a"/><stop offset="1" stop-color="#142e46"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112436"/><stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123048"/><stop offset="1" stop-color="#0b2034"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2dc7c9" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2dc7c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#04101b" stop-opacity=".7"/>
      <stop offset="1" stop-color="#04101b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="monScreen"><polygon points="0,-14 -150,-100 -150,-196 0,-110"/></clipPath>
    <clipPath id="phScreen"><polygon points="0,-8 -46,-34 -46,-104 0,-78"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- desk plane -->
  <polygon points="330,116 630,290 330,464 30,290" fill="#0a1b2b" opacity=".5"/>
  <g stroke="#2dc7c9" stroke-opacity=".1" stroke-width="1">
    <path d="M180 203L480 377M255 160L555 334"/>
    <path d="M480 203L180 377"/>
  </g>
  <ellipse cx="300" cy="280" rx="230" ry="115" fill="url(#pool)"/>

  <!-- ===== monitor ===== -->
  <g transform="translate(392 300)">
    <ellipse cx="-80" cy="-6" rx="130" ry="46" fill="url(#shadow)"/>

    <!-- stand -->
    <g>
      <polygon points="-58,-24 -34,-10 -58,4 -82,-10" fill="url(#fTop)"/>
      <polygon points="-82,-10 -58,4 -58,14 -82,0" fill="url(#fLeft)"/>
      <polygon points="-58,4 -34,-10 -34,0 -58,14" fill="url(#fRight)"/>
      <polygon points="-64,-46 -52,-39 -52,-17 -64,-24" fill="#1a3750"/>
    </g>

    <!-- panel body: thin slab, screen on the left-facing plane -->
    <polygon points="0,-110 -150,-196 -132,-186 18,-100" fill="url(#fTop)"/>
    <polygon points="0,-14 18,-4 18,-100 0,-110" fill="url(#fRight)"/>
    <polygon points="0,-14 -150,-100 -150,-196 0,-110" fill="#16344c"/>
    <polygon points="0,-20 -142,-102 -142,-190 0,-108" fill="url(#screen)"/>

    <!-- what is on the screen -->
    <g clip-path="url(#monScreen)">
      <!-- browser bar -->
      <polygon points="-6,-107 -140,-184 -140,-172 -6,-95" fill="#8fb7cf" fill-opacity=".14"/>
      <g fill="#2dc7c9" fill-opacity=".7">
        <ellipse cx="-16" cy="-97" rx="3" ry="2.6"/>
        <ellipse cx="-26" cy="-103" rx="3" ry="2.6" fill-opacity=".5"/>
        <ellipse cx="-36" cy="-109" rx="3" ry="2.6" fill-opacity=".35"/>
      </g>
      <!-- product tiles -->
      <g fill="#2dc7c9" fill-opacity=".3">
        <polygon points="-24,-84 -60,-105 -60,-131 -24,-110"/>
        <polygon points="-66,-108 -102,-129 -102,-155 -66,-134"/>
        <polygon points="-108,-132 -144,-153 -144,-179 -108,-158"/>
      </g>
      <g fill="#8fb7cf" fill-opacity=".3">
        <polygon points="-24,-106 -60,-127 -60,-134 -24,-113"/>
        <polygon points="-66,-130 -102,-151 -102,-158 -66,-137"/>
        <polygon points="-108,-154 -144,-175 -144,-182 -108,-161"/>
      </g>
      <!-- checkout row -->
      <g fill="#8fb7cf" fill-opacity=".22">
        <polygon points="-30,-38 -120,-90 -120,-104 -30,-52"/>
      </g>
      <polygon points="-8,-32 -32,-46 -32,-62 -8,-48" fill="#2dc7c9" fill-opacity=".85"/>
    </g>

    <polyline points="0,-110 -150,-196" fill="none" stroke="#2dc7c9" stroke-opacity=".3" stroke-width="1.2"/>
  </g>

  <!-- ===== phone ===== -->
  <g transform="translate(176 314)">
    <ellipse cx="-22" cy="4" rx="56" ry="24" fill="url(#shadow)"/>
    <polygon points="0,-78 -46,-104 -38,-99 8,-73" fill="url(#fTop)"/>
    <polygon points="0,-8 8,-3 8,-73 0,-78" fill="url(#fRight)"/>
    <polygon points="0,-8 -46,-34 -46,-104 0,-78" fill="#16344c"/>
    <polygon points="0,-13 -41,-36 -41,-99 0,-76" fill="url(#screen)"/>
    <g clip-path="url(#phScreen)">
      <polygon points="-4,-74 -38,-93 -38,-79 -4,-60" fill="#2dc7c9" fill-opacity=".32"/>
      <g fill="#8fb7cf" fill-opacity=".3">
        <polygon points="-4,-56 -38,-75 -38,-80 -4,-61"/>
        <polygon points="-4,-44 -26,-56 -26,-61 -4,-49"/>
      </g>
      <polygon points="-6,-27 -34,-43 -34,-53 -6,-37" fill="#2dc7c9" fill-opacity=".7"/>
    </g>
    <polyline points="0,-78 -46,-104" fill="none" stroke="#2dc7c9" stroke-opacity=".28" stroke-width="1.1"/>
  </g>

  <!-- cart marker floating over the store -->
  <g transform="translate(300 128)">
    <circle r="26" fill="#0e2740" stroke="#2dc7c9" stroke-width="1.8" class="float"/>
    <g stroke="#2dc7c9" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-11,-11)">
      <circle cx="9.5" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>
      <path d="M3 4h2.2l2.4 11.2h10.6l1.8-7.6H6.2"/>
    </g>
  </g>

  <style>
    .float { animation: bob 4s ease-in-out infinite }
    @keyframes bob { 0%,100% { opacity:.75 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .float { animation: none } }
  </style>
</svg>
