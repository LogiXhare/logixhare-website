<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three stacked server units with drive bays and status lights, linked out to a globe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- server stack -->
  <g stroke="url(#ln)" stroke-width="1.6" fill="none" opacity=".85">
    <rect x="72" y="96" width="250" height="60" rx="8"/>
    <rect x="72" y="172" width="250" height="60" rx="8"/>
    <rect x="72" y="248" width="250" height="60" rx="8"/>
  </g>

  <!-- drive bays -->
  <g stroke="#8fb7cf" stroke-opacity=".45" stroke-width="1.2">
    <g>
      <line x1="150" y1="110" x2="150" y2="142"/><line x1="172" y1="110" x2="172" y2="142"/>
      <line x1="194" y1="110" x2="194" y2="142"/><line x1="216" y1="110" x2="216" y2="142"/>
    </g>
    <g transform="translate(0,76)">
      <line x1="150" y1="110" x2="150" y2="142"/><line x1="172" y1="110" x2="172" y2="142"/>
      <line x1="194" y1="110" x2="194" y2="142"/><line x1="216" y1="110" x2="216" y2="142"/>
    </g>
    <g transform="translate(0,152)">
      <line x1="150" y1="110" x2="150" y2="142"/><line x1="172" y1="110" x2="172" y2="142"/>
      <line x1="194" y1="110" x2="194" y2="142"/><line x1="216" y1="110" x2="216" y2="142"/>
    </g>
  </g>

  <!-- status lights -->
  <g fill="#2dc7c9">
    <circle cx="100" cy="126" r="5" class="blink"/>
    <circle cx="100" cy="202" r="5" class="blink b2"/>
    <circle cx="100" cy="278" r="5" class="blink b3"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".5">
    <circle cx="118" cy="126" r="3"/><circle cx="118" cy="202" r="3"/><circle cx="118" cy="278" r="3"/>
  </g>

  <!-- uplinks to the globe -->
  <g stroke="url(#ln)" stroke-width="1.3" stroke-opacity=".55" fill="none">
    <path d="M322 126h58q22 0 22 22v36"/>
    <path d="M322 202h80"/>
    <path d="M322 278h58q22 0 22-22v-36"/>
  </g>

  <!-- globe -->
  <g transform="translate(482 202)" fill="none" stroke="url(#ln)" stroke-width="1.6">
    <circle r="72" stroke-opacity=".9"/>
    <ellipse rx="30" ry="72" stroke-opacity=".5"/>
    <line x1="-72" y1="-26" x2="72" y2="-26" stroke-opacity=".5"/>
    <line x1="-72" y1="26" x2="72" y2="26" stroke-opacity=".5"/>
    <line x1="-72" y1="0" x2="72" y2="0" stroke-opacity=".35"/>
  </g>
  <g fill="#2dc7c9">
    <circle cx="452" cy="163" r="3.5" class="blink b2"/>
    <circle cx="520" cy="228" r="3.5" class="blink"/>
    <circle cx="482" cy="202" r="3" fill-opacity=".8"/>
  </g>

  <style>
    .blink { animation: lx 3.6s ease-in-out infinite; }
    .b2 { animation-delay: 1.2s; }
    .b3 { animation-delay: 2.4s; }
    @keyframes lx { 0%,100% { opacity:.45 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none } }
  </style>
</svg>
