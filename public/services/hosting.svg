<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="An isometric server rack with lit drive bays, patched across to an uplink switch on a raised floor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2136"/><stop offset=".55" stop-color="#0e2740"/><stop offset="1" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d5675"/><stop offset="1" stop-color="#22455f"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3f5a"/><stop offset="1" stop-color="#142e46"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112436"/><stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#61c0e0" stop-opacity=".2"/>
      <stop offset="1" stop-color="#61c0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#04101b" stop-opacity=".75"/>
      <stop offset="1" stop-color="#04101b" stop-opacity="0"/>
    </radialGradient>

    <!-- Face details are drawn with skewY, which does not respect the face
         polygon on its own — without these clips the bays spill past the box. -->
    <clipPath id="rackL"><polygon points="-78,-141 0,-96 0,0 -78,-45"/></clipPath>
    <clipPath id="rackR"><polygon points="0,-96 78,-141 78,-45 0,0"/></clipPath>
    <clipPath id="swL"><polygon points="-52,24 0,54 0,84 -52,54"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- raised floor -->
  <polygon points="320,110 620,284 320,458 20,284" fill="#0a1b2b" opacity=".55"/>
  <g stroke="#61c0e0" stroke-opacity=".12" stroke-width="1">
    <path d="M170 197L470 371M245 154L545 328"/>
    <path d="M470 197L170 371M545 154L245 328"/>
  </g>
  <ellipse cx="300" cy="290" rx="230" ry="115" fill="url(#pool)"/>

  <!-- ===== main rack ===== -->
  <g transform="translate(250 296)">
    <ellipse cx="0" cy="-45" rx="104" ry="58" fill="url(#shadow)"/>

    <polygon points="0,-186 78,-141 0,-96 -78,-141" fill="url(#fTop)"/>
    <polygon points="-78,-141 0,-96 0,0 -78,-45" fill="url(#fLeft)"/>
    <polygon points="0,-96 78,-141 78,-45 0,0" fill="url(#fRight)"/>

    <!-- left face: lit drive bays -->
    <g clip-path="url(#rackL)">
      <g transform="skewY(-30)">
        <g fill="#0c1f31">
          <rect x="-70" y="-116" width="62" height="16" rx="3"/>
          <rect x="-70" y="-94" width="62" height="16" rx="3"/>
          <rect x="-70" y="-72" width="62" height="16" rx="3"/>
          <rect x="-70" y="-50" width="62" height="16" rx="3"/>
          <rect x="-70" y="-28" width="62" height="16" rx="3"/>
        </g>
        <g fill="#8fb7cf" fill-opacity=".22">
          <rect x="-46" y="-113" width="32" height="3" rx="1.5"/>
          <rect x="-46" y="-91" width="32" height="3" rx="1.5"/>
          <rect x="-46" y="-69" width="32" height="3" rx="1.5"/>
          <rect x="-46" y="-47" width="32" height="3" rx="1.5"/>
          <rect x="-46" y="-25" width="32" height="3" rx="1.5"/>
        </g>
        <g fill="#61c0e0">
          <circle cx="-62" cy="-108" r="3.4" class="b"/>
          <circle cx="-62" cy="-86" r="3.4" class="b b2"/>
          <circle cx="-62" cy="-64" r="3.4" opacity=".55"/>
          <circle cx="-62" cy="-42" r="3.4" class="b b3"/>
          <circle cx="-62" cy="-20" r="3.4" opacity=".7"/>
        </g>
      </g>
    </g>

    <!-- right face: vented panels -->
    <g clip-path="url(#rackR)">
      <g transform="skewY(30)">
        <g fill="#8fb7cf" fill-opacity=".13">
          <rect x="10" y="-126" width="60" height="18" rx="3"/>
          <rect x="10" y="-102" width="60" height="18" rx="3"/>
          <rect x="10" y="-78" width="60" height="18" rx="3"/>
          <rect x="10" y="-54" width="60" height="18" rx="3"/>
        </g>
        <g stroke="#8fb7cf" stroke-opacity=".16" stroke-width="1">
          <path d="M16 -120h48M16 -114h48M16 -96h48M16 -90h48M16 -72h48M16 -66h48M16 -48h48M16 -42h48"/>
        </g>
      </g>
    </g>

    <polyline points="0,-186 78,-141 78,-45" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1.2"/>
    <polyline points="0,-186 -78,-141 -78,-45" fill="none" stroke="#61c0e0" stroke-opacity=".18" stroke-width="1.2"/>
  </g>

  <!-- ===== uplink switch ===== -->
  <g transform="translate(456 232)">
    <ellipse cx="0" cy="54" rx="70" ry="38" fill="url(#shadow)"/>
    <polygon points="0,-6 52,24 0,54 -52,24" fill="url(#fTop)"/>
    <polygon points="-52,24 0,54 0,84 -52,54" fill="url(#fLeft)"/>
    <polygon points="0,54 52,24 52,54 0,84" fill="url(#fRight)"/>
    <g clip-path="url(#swL)">
      <g transform="skewY(-30)" fill="#61c0e0">
        <rect x="-44" y="44" width="8" height="4" rx="2" class="b b2"/>
        <rect x="-31" y="44" width="8" height="4" rx="2" opacity=".6"/>
        <rect x="-18" y="44" width="8" height="4" rx="2" class="b"/>
        <rect x="-5" y="44" width="8" height="4" rx="2" opacity=".75"/>
      </g>
    </g>
    <polyline points="0,-6 52,24 52,54" fill="none" stroke="#61c0e0" stroke-opacity=".25" stroke-width="1.2"/>
  </g>

  <!-- patch cables -->
  <g fill="none" stroke="#61c0e0" stroke-opacity=".5" stroke-width="2.2" stroke-linecap="round">
    <path d="M330 206q54 6 74 36"/>
    <path d="M330 220q58 10 76 38" stroke-opacity=".28"/>
  </g>

  <style>
    .b { animation: blink 3.4s ease-in-out infinite }
    .b2 { animation-delay: 1.1s } .b3 { animation-delay: 2.2s }
    @keyframes blink { 0%,100% { opacity:.3 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .b { animation: none } }
  </style>
</svg>
