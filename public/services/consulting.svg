<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A staged roadmap with milestone markers, a compass, and an SLA response-time panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- roadmap path -->
  <path d="M72 300C140 300 132 216 200 216s60-84 128-84 60-64 128-64h40"
        fill="none" stroke="#8fb7cf" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M72 300C140 300 132 216 200 216s60-84 128-84"
        fill="none" stroke="url(#ln)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- milestones -->
  <g>
    <circle cx="72" cy="300" r="9" fill="#0b1c31" stroke="#2dc7c9" stroke-width="2.2"/>
    <circle cx="72" cy="300" r="3.5" fill="#2dc7c9"/>
    <circle cx="200" cy="216" r="9" fill="#0b1c31" stroke="#2dc7c9" stroke-width="2.2"/>
    <circle cx="200" cy="216" r="3.5" fill="#2dc7c9"/>
    <circle cx="328" cy="132" r="11" fill="#0b1c31" stroke="#2dc7c9" stroke-width="2.4" class="blink"/>
    <circle cx="328" cy="132" r="4" fill="#2dc7c9"/>
    <circle cx="456" cy="68" r="9" fill="#0b1c31" stroke="#8fb7cf" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- stage labels -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.4" fill="#8fb7cf" fill-opacity=".6">
    <text x="56" y="334">01</text><text x="184" y="250">02</text>
    <text x="312" y="166" fill="#2dc7c9" fill-opacity=".9">03</text><text x="440" y="102">04</text>
  </g>

  <!-- gap-analysis bars, current vs target -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.3">
    <rect x="60" y="72" width="184" height="104" rx="8"/>
  </g>
  <g>
    <rect x="78" y="98" width="70" height="10" rx="5" fill="#2dc7c9" fill-opacity=".8"/>
    <rect x="152" y="98" width="74" height="10" rx="5" fill="#8fb7cf" fill-opacity=".18"/>
    <rect x="78" y="122" width="104" height="10" rx="5" fill="#2dc7c9" fill-opacity=".8"/>
    <rect x="186" y="122" width="40" height="10" rx="5" fill="#8fb7cf" fill-opacity=".18"/>
    <rect x="78" y="146" width="48" height="10" rx="5" fill="#2dc7c9" fill-opacity=".8"/>
    <rect x="130" y="146" width="96" height="10" rx="5" fill="#8fb7cf" fill-opacity=".18"/>
  </g>

  <!-- compass -->
  <g transform="translate(508 232)">
    <circle r="62" fill="#0b1c31" stroke="url(#ln)" stroke-width="2" stroke-opacity=".9"/>
    <circle r="48" fill="none" stroke="#8fb7cf" stroke-opacity=".25" stroke-width="1.2"/>
    <g stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="-52"/><line x1="0" y1="52" x2="0" y2="62"/>
      <line x1="-62" y1="0" x2="-52" y2="0"/><line x1="52" y1="0" x2="62" y2="0"/>
    </g>
    <g transform="rotate(38)">
      <polygon points="0,-38 11,0 0,9 -11,0" fill="#2dc7c9" fill-opacity=".95"/>
      <polygon points="0,38 11,0 0,-9 -11,0" fill="#8fb7cf" fill-opacity=".3"/>
    </g>
    <circle r="4.5" fill="#0b1c31" stroke="#2dc7c9" stroke-width="1.6"/>
  </g>

  <!-- SLA panel -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.3">
    <rect x="396" y="316" width="196" height="56" rx="8"/>
  </g>
  <g transform="translate(424 344)" fill="none" stroke="#2dc7c9" stroke-width="1.8" stroke-linecap="round">
    <circle r="14" stroke-opacity=".85"/>
    <polyline points="0,-8 0,0 6,4"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".45">
    <rect x="452" y="334" width="96" height="8" rx="4"/>
    <rect x="452" y="350" width="62" height="6" rx="3"/>
  </g>

  <style>
    .blink { animation: lx 3.4s ease-in-out infinite; }
    @keyframes lx { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none } }
  </style>
</svg>
