<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A rising traffic chart under a magnifier, with a search result list and social reach nodes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1c31"/><stop offset=".6" stop-color="#0e2740"/><stop offset="1" stop-color="#081524"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9"/><stop offset="1" stop-color="#8fb7cf"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="140" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dc7c9" stop-opacity=".3"/><stop offset="1" stop-color="#2dc7c9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- search result list -->
  <g fill="none" stroke="#8fb7cf" stroke-opacity=".4" stroke-width="1.3">
    <rect x="44" y="72" width="212" height="54" rx="7"/>
    <rect x="44" y="140" width="212" height="46" rx="7"/>
    <rect x="44" y="200" width="212" height="46" rx="7"/>
  </g>
  <rect x="44" y="72" width="212" height="54" rx="7" fill="#2dc7c9" fill-opacity=".12"/>
  <rect x="44" y="72" width="3" height="54" rx="1.5" fill="#2dc7c9"/>
  <g fill="#8fb7cf" fill-opacity=".45">
    <rect x="62" y="88" width="120" height="8" rx="4"/><rect x="62" y="104" width="164" height="6" rx="3"/>
  </g>
  <g fill="#8fb7cf" fill-opacity=".26">
    <rect x="62" y="154" width="96" height="7" rx="3.5"/><rect x="62" y="168" width="148" height="5" rx="2.5"/>
    <rect x="62" y="214" width="110" height="7" rx="3.5"/><rect x="62" y="228" width="132" height="5" rx="2.5"/>
  </g>
  <text x="44" y="288" fill="#2dc7c9" fill-opacity=".7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.5">RANK 1</text>

  <!-- chart panel -->
  <g fill="none" stroke="url(#ln)" stroke-width="1.7">
    <rect x="296" y="72" width="300" height="256" rx="10" stroke-opacity=".85"/>
  </g>
  <g stroke="#8fb7cf" stroke-opacity=".16" stroke-width="1">
    <line x1="296" y1="140" x2="596" y2="140"/><line x1="296" y1="188" x2="596" y2="188"/>
    <line x1="296" y1="236" x2="596" y2="236"/><line x1="296" y1="284" x2="596" y2="284"/>
  </g>

  <path d="M324 300l46-30 46 14 46-54 46-22 42-46v138H324Z" fill="url(#fill)"/>
  <path d="M324 300l46-30 46 14 46-54 46-22 42-46" fill="none" stroke="#2dc7c9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2dc7c9">
    <circle cx="324" cy="300" r="4" fill-opacity=".6"/>
    <circle cx="370" cy="270" r="4" fill-opacity=".6"/>
    <circle cx="416" cy="284" r="4" fill-opacity=".6"/>
    <circle cx="462" cy="230" r="4" fill-opacity=".8"/>
    <circle cx="508" cy="208" r="4" fill-opacity=".8"/>
    <circle cx="550" cy="162" r="5.5" class="blink"/>
  </g>

  <!-- magnifier over the rise -->
  <g transform="translate(508 196)" fill="none" stroke="url(#ln)" stroke-width="2.4" stroke-linecap="round">
    <circle r="46" fill="#0b1c31" fill-opacity=".35" stroke-opacity=".9"/>
    <line x1="33" y1="33" x2="58" y2="58"/>
  </g>

  <!-- social reach nodes -->
  <g stroke="url(#ln)" stroke-width="1.4" stroke-opacity=".45" fill="none">
    <path d="M148 310l52 30"/><path d="M200 340l58-22"/><path d="M200 340v34"/>
  </g>
  <g fill="#2dc7c9">
    <circle cx="148" cy="310" r="6" fill-opacity=".85"/>
    <circle cx="200" cy="340" r="7" class="blink"/>
    <circle cx="258" cy="318" r="5" fill-opacity=".6"/>
    <circle cx="200" cy="374" r="5" fill-opacity=".6"/>
  </g>

  <style>
    .blink { animation: lx 3.4s ease-in-out infinite; }
    @keyframes lx { 0%,100% { opacity:.5 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .blink { animation: none } }
  </style>
</svg>
