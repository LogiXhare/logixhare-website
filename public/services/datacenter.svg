<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="An isometric data centre hall: two rows of equipment racks on a raised floor, lit overhead, with a cooling unit at the end of the aisle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2136"/><stop offset=".55" stop-color="#0e2740"/><stop offset="1" stop-color="#071320"/>
    </linearGradient>

    <!-- Three face tones make the isometric boxes read as solid: top catches
         the overhead light, left is mid, right falls away. -->
    <linearGradient id="fTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4f6e"/><stop offset="1" stop-color="#20405c"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a55"/><stop offset="1" stop-color="#132c44"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102436"/><stop offset="1" stop-color="#0a1a29"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#61c0e0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#61c0e0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#61c0e0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#61c0e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- raised floor -->
  <g opacity=".5">
    <polygon points="320,132 610,300 320,468 30,300" fill="#0a1b2b"/>
    <g stroke="#61c0e0" stroke-opacity=".14" stroke-width="1">
      <path d="M175 216L465 384M223 188L513 356M271 160L561 328"/>
      <path d="M465 216L175 384M513 188L223 356M561 160L271 328"/>
    </g>
  </g>
  <ellipse cx="320" cy="300" rx="210" ry="120" fill="url(#pool)"/>

  <!-- overhead light strips: flat panels only. An earlier version hung a
       vertical "beam" quad under each, which read as a floating slab. -->
  <g>
    <ellipse cx="196" cy="100" rx="64" ry="34" fill="url(#pool)"/>
    <ellipse cx="444" cy="100" rx="64" ry="34" fill="url(#pool)"/>
    <polygon points="196,86 232,107 196,128 160,107" fill="#61c0e0" fill-opacity=".4"/>
    <polygon points="444,86 480,107 444,128 408,107" fill="#61c0e0" fill-opacity=".4"/>
    <polygon points="196,92 222,107 196,122 170,107" fill="#a3dbf0" fill-opacity=".45"/>
    <polygon points="444,92 470,107 444,122 418,107" fill="#a3dbf0" fill-opacity=".45"/>
  </g>

  <!-- ===== left row of racks: drawn back to front ===== -->
  <g>
    <g transform="translate(196 214)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <g fill="#61c0e0">
        <rect x="-30" y="-88" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".85" class="b"/>
        <rect x="-30" y="-64" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".6"/>
        <rect x="-30" y="-40" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".8" class="b b2"/>
        <rect x="-30" y="-16" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".5"/>
      </g>
      <g fill="#8fb7cf" fill-opacity=".22">
        <rect x="6" y="-92" width="24" height="4" rx="2" transform="skewY(30.5)"/>
        <rect x="6" y="-68" width="24" height="4" rx="2" transform="skewY(30.5)"/>
        <rect x="6" y="-44" width="24" height="4" rx="2" transform="skewY(30.5)"/>
      </g>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <g transform="translate(150 242)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <g fill="#61c0e0">
        <rect x="-30" y="-88" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".7"/>
        <rect x="-30" y="-64" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".85" class="b b3"/>
        <rect x="-30" y="-40" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".5"/>
        <rect x="-30" y="-16" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".75" class="b"/>
      </g>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <g transform="translate(104 270)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <g fill="#61c0e0">
        <rect x="-30" y="-88" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".8" class="b b2"/>
        <rect x="-30" y="-64" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".5"/>
        <rect x="-30" y="-40" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".7"/>
        <rect x="-30" y="-16" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".85" class="b b3"/>
      </g>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>
  </g>

  <!-- ===== right row ===== -->
  <g>
    <g transform="translate(444 214)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <g fill="#61c0e0">
        <rect x="-30" y="-88" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".85" class="b b3"/>
        <rect x="-30" y="-64" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".55"/>
        <rect x="-30" y="-40" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".75"/>
        <rect x="-30" y="-16" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".6" class="b"/>
      </g>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <g transform="translate(490 242)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <!-- storage array: drive rows rather than status LEDs -->
      <g fill="#8fb7cf" fill-opacity=".3">
        <rect x="-30" y="-92" width="24" height="7" rx="1.5" transform="skewY(-30.5)"/>
        <rect x="-30" y="-74" width="24" height="7" rx="1.5" transform="skewY(-30.5)"/>
        <rect x="-30" y="-56" width="24" height="7" rx="1.5" transform="skewY(-30.5)"/>
        <rect x="-30" y="-38" width="24" height="7" rx="1.5" transform="skewY(-30.5)"/>
      </g>
      <rect x="-30" y="-20" width="24" height="3" rx="1.5" transform="skewY(-30.5)" fill="#61c0e0" opacity=".8" class="b b2"/>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>

    <g transform="translate(536 270)">
      <polygon points="0,-120 34,-100 0,-80 -34,-100" fill="url(#fTop)"/>
      <polygon points="-34,-100 0,-80 0,0 -34,20" fill="url(#fLeft)"/>
      <polygon points="0,-80 34,-100 34,20 0,0" fill="url(#fRight)"/>
      <g fill="#61c0e0">
        <rect x="-30" y="-88" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".6"/>
        <rect x="-30" y="-64" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".85" class="b"/>
        <rect x="-30" y="-40" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".5"/>
        <rect x="-30" y="-16" width="24" height="3" rx="1.5" transform="skewY(-30.5)" opacity=".7" class="b b2"/>
      </g>
      <polyline points="0,-120 34,-100 34,20" fill="none" stroke="#61c0e0" stroke-opacity=".3" stroke-width="1"/>
    </g>
  </g>

  <!-- cooling unit closing the aisle -->
  <g transform="translate(320 330)">
    <polygon points="0,-74 44,-48 0,-22 -44,-48" fill="url(#fTop)"/>
    <polygon points="-44,-48 0,-22 0,26 -44,0" fill="url(#fLeft)"/>
    <polygon points="0,-22 44,-48 44,0 0,26" fill="url(#fRight)"/>
    <g fill="none" stroke="#61c0e0" stroke-opacity=".55" stroke-width="1.6">
      <ellipse cx="-22" cy="-13" rx="13" ry="8" class="spin"/>
    </g>
    <g fill="#8fb7cf" fill-opacity=".25">
      <rect x="8" y="-30" width="28" height="4" rx="2" transform="skewY(30.5)"/>
      <rect x="8" y="-18" width="18" height="4" rx="2" transform="skewY(30.5)"/>
    </g>
  </g>

  <style>
    .b { animation: blink 3.6s ease-in-out infinite }
    .b2 { animation-delay: 1.2s } .b3 { animation-delay: 2.4s }
    .spin { animation: pulse 2.8s ease-in-out infinite; transform-origin: -22px -13px }
    @keyframes blink { 0%,100% { opacity:.3 } 50% { opacity:1 } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
    @media (prefers-reduced-motion: reduce) { .b, .spin { animation: none } }
  </style>
</svg>
